<div class="default-style">
  <dx-tree-list
    id="employees"
    [dataSource]="dataSource"
    dataStructure="tree"
    [keyExpr]="dataKey"
    itemsExpr="items"
    parentIdExpr="Parent_ID"
    [expandedRowKeys]="expandedRowKeys"
    [showRowLines]="true"
    [showBorders]="true"
    [columnAutoWidth]="true"
  >
    <dxo-editing
      mode="cell"
      [allowAdding]="true"
      [allowUpdating]="true"
      [allowDeleting]="true"
    ></dxo-editing>
    <dxi-column dataField="Title" caption="Position"></dxi-column>
    <dxi-column dataField="Full_Name">
      <dxi-validation-rule type="required"></dxi-validation-rule>
    </dxi-column>
    <dxi-column dataField="City"></dxi-column>
    <dxi-column dataField="State"></dxi-column>
    <dxi-column dataField="Mobile_Phone"></dxi-column>
    <dxi-column dataField="Hire_Date" dataType="date"></dxi-column>
  </dx-tree-list>
</div>
